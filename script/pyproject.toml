[project]
name = "pdpot-analyze"
version = "0.1.0"
description = "Data analysis pipeline for PDPoT experiments - generates LaTeX tables and figures from Excel datasets"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
  { name = "Paul Bouman", email = "bouman@ese.eur.nl" },
  { name = "Rick Willemsen", email = "rick_willemsen@sutd.edu.sg" },
  { name = "Gizem Özbaygın", email = "ozbaygin@bilkent.edu.tr" },
]
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.10",
    "seaborn>=0.12",
    "openpyxl>=3.1",
]

[project.scripts]
pdpot-script = "src.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
